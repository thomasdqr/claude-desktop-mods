name: Check mods

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check manifests, code and bundle
        run: python3 check_mods.py
      - name: Check changed mods have a new version
        if: github.event_name == 'pull_request'
        run: python3 check_mods.py --base origin/${{ github.base_ref }}
